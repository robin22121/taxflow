[project]
name = "taxflow-backend"
version = "0.1.0"
description = "TaxFlow AI backend — payroll AI automation for Korean tax offices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "anthropic>=0.40",
    "openpyxl>=3.1",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "cryptography>=43",
    "redis>=5.2",
    "celery>=5.4",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
