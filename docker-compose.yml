services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taxflow
      POSTGRES_PASSWORD: taxflow
      POSTGRES_DB: taxflow
    ports:
      - "5432:5432"
    volumes:
      - taxflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - taxflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taxflow_pg:
  taxflow_redis:
