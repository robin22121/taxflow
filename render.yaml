# Render Blueprint — https://render.com/docs/blueprint-spec
databases:
  - name: taxflow-db
    plan: free
    databaseName: taxflow
    user: taxflow
    region: singapore

services:
  # ── Backend (FastAPI) ────────────────────────────────
  - type: web
    name: taxflow-backend
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    # NOTE: seed (`python -m app.scripts.seed`)는 prod DB를 wipe하므로 buildCommand에 포함하지 않음.
    # 초기 세팅 또는 데모 데이터 리셋이 필요할 때만 Render Shell에서 수동 실행:
    #   python -m app.scripts.seed
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: taxflow-uploads
      mountPath: /data/uploads
      sizeGB: 1
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: taxflow-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RRN_ENCRYPTION_KEY
        # Must be base64-encoded 32 bytes. Generate with:
        # python -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
        sync: false
      - key: APP_BASE_URL
        value: https://taxflow-backend.onrender.com
      - key: APP_PUBLIC_URL
        value: https://www.easyonechon.co.kr
      - key: CORS_EXTRA_ORIGINS
        value: https://easyonechon.co.kr,https://taxflow-gamma.vercel.app
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ── 메시징 (Aligo: 알림톡 + SMS 공용 계정) ────────────
      # 알림톡: 카카오 비즈채널 인증 완료 후 'aligo' / 'nhn_cloud' 로 변경
      - key: KAKAO_ALIMTALK_PROVIDER
        value: stub
      - key: ALIGO_API_KEY
        sync: false
      - key: ALIGO_USER_ID
        sync: false
      - key: ALIGO_SENDER_KEY
        sync: false                   # 카카오 비즈채널 발신프로필 키
      - key: SMS_PROVIDER
        value: aligo
      - key: ALIGO_SMS_SENDER
        sync: false                   # SMS 발신번호 (Aligo 사전 등록)
      # ── 이메일 (Resend 권장, SendGrid / NCP Outbound도 지원) ──
      - key: EMAIL_PROVIDER
        value: resend                 # resend / sendgrid / ncp_outbound / stub
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false                   # 예: 이지원천 <noreply@yourdomain.com>
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
